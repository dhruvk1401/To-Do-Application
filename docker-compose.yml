version: "3.8"

services:
  mongo-db:
    image: mongo:latest
    container_name: "Database"
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - to-do-network
    volumes:
      - mongo-data:/data/db

  dbservice:
    container_name: "DB-Service"
    build:
      context: ./dbservice
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - to-do-network

networks:
  to-do-network:
    external: true

volumes:
  mongo-data:
